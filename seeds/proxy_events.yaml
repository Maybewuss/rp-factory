# 表面事件种子库（琐碎日常事件，用于掩盖深层动机）
# 按场景类型分类

- category: "饮食意外"
  events:
    - "买了一杯热咖啡，刚出店门就全洒在了白衬衫上。"
    - "外卖送错了，点的是少辣结果来了变态辣，舌头都肿了。"
    - "泡面刚泡好被猫打翻了，地板上全是汤。"
    - "精心做了一顿饭，结果忘关火全烧焦了，厨房满是烟。"

- category: "物品损坏"
  events:
    - "手机屏幕摔碎了，刚换了一个月。"
    - "新买的耳机只有一边有声音。"
    - "刚充满电的充电宝突然就不工作了。"
    - "眼镜腿断了，只能歪着戴。"
    - "自行车链条在上坡途中断了。"

- category: "出行倒霉"
  events:
    - "等了半小时公交车，结果上去坐了一站发现方向反了。"
    - "打伞还是被侧风吹的雨淋湿了整条裤子。"
    - "导航带到了一条死路，还得绕一大圈。"
    - "鞋底突然开胶，走路啪嗒啪嗒响。"

- category: "居家琐事"
  events:
    - "钥匙锁在屋里了，还穿着睡衣站在楼道里。"
    - "洗衣机把一件红色袜子和白衬衫一起洗了。"
    - "马桶堵了，水漫到了浴室地板。"
    - "半夜楼上在装修，完全睡不着。"

- category: "社交尴尬"
  events:
    - "在电梯里和邻居打招呼，对方完全没理。"
    - "群里发了一条消息，半天没有人回复。"
    - "发现自己一整天拉链都是开着的。"
    - "给错误的人发了一条吐槽消息，而且撤回超时了。"

- category: "购物翻车"
  events:
    - "网购的衣服到了，尺码完全不对。"
    - "超市排了最长的队，结果前面的人要退货。"
    - "买了个网红推荐的零食，难吃到想退钱。"
    - "双十一抢到的东西发现比平时还贵。"
