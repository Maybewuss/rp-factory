# 表面事件种子库（琐碎日常事件，用于掩盖深层动机）
# v3.1.1 大幅扩充：10 大类，60+ 条事件

- category: "饮食意外"
  events:
    - "买了一杯热咖啡，刚出店门就全洒在了白衬衫上。"
    - "外卖送错了，点的是少辣结果来了变态辣，舌头都肿了。"
    - "泡面刚泡好被猫打翻了，地板上全是汤。"
    - "精心做了一顿饭，结果忘关火全烧焦了，厨房满是烟。"
    - "奶茶吸管戳不进去，使劲一戳杯子炸了洒了一桌子。"
    - "微波炉热牛奶热过头了，开门的时候炸了一整个微波炉内壁。"
    - "吃了一口以为是巧克力的东西，结果是芥末味的。"
    - "约了朋友去吃的网红店，排了两小时结果味道还不如楼下兰州拉面。"

- category: "物品损坏"
  events:
    - "手机屏幕摔碎了，刚换了一个月。"
    - "新买的耳机只有一边有声音。"
    - "刚充满电的充电宝突然就不工作了。"
    - "眼镜腿断了，只能歪着戴。"
    - "自行车链条在上坡途中断了。"
    - "新买的杯子第一天就磕掉了一小块瓷。"
    - "数据线接触不良，充一晚上电到早上只有30%。"
    - "拉链拉到一半卡住了，拉也不是不拉也不是。"

- category: "出行倒霉"
  events:
    - "等了半小时公交车，结果上去坐了一站发现方向反了。"
    - "打伞还是被侧风吹的雨淋湿了整条裤子。"
    - "导航带到了一条死路，还得绕一大圈。"
    - "鞋底突然开胶，走路啪嗒啪嗒响。"
    - "地铁门关到一半夹住了包带，包被拖出去半米才松开。"
    - "刚洗好的鞋子出门第一步就踩进了泥水坑。"
    - "共享单车扫了三辆全是坏的，第四辆骑了不到一百米又没电了。"

- category: "居家琐事"
  events:
    - "钥匙锁在屋里了，还穿着睡衣站在楼道里。"
    - "洗衣机把一件红色袜子和白衬衫一起洗了。"
    - "马桶堵了，水漫到了浴室地板。"
    - "半夜楼上在装修，完全睡不着。"
    - "洗完澡发现忘了拿浴巾，毛巾也不在。"
    - "电闸跳了三次，第三次冰箱里的冰淇淋全化了。"
    - "快递显示已签收但门口什么都没有。"
    - "闹钟设成了下午六点不是早上六点。"

- category: "社交尴尬"
  events:
    - "在电梯里和邻居打招呼，对方完全没理。"
    - "群里发了一条消息，半天没有人回复。"
    - "发现自己一整天拉链都是开着的。"
    - "给错误的人发了一条吐槽消息，而且撤回超时了。"
    - "视频通话忘记关摄像头，背景里是乱成狗窝的房间。"
    - "在安静的图书馆里手机突然外放了沙雕视频的声音。"
    - "叫别人名字叫错了，对方纠正了之后更尴尬了。"

- category: "购物翻车"
  events:
    - "网购的衣服到了，尺码完全不对。"
    - "超市排了最长的队，结果前面的人要退货。"
    - "买了个网红推荐的零食，难吃到想退钱。"
    - "双十一抢到的东西发现比平时还贵。"
    - "退货的快递寄出去一周了显示物流异常。"
    - "花了三十分钟比价最终省了两块钱。"

- category: "天气作妖"
  events:
    - "出门没带伞，走到一半突然暴雨，等了二十分钟雨停了太阳出来了。"
    - "穿了短袖出门结果降温十度，冻得嘴唇发紫。"
    - "前一天看天气预报说晴天，结果遇上了一年来最大的雾霾。"
    - "刚晒上的被子就开始下雨了，冲出去收的时候滑了一跤。"

- category: "电子设备"
  events:
    - "电脑在没保存的情况下蓝屏了，两小时的工作全没了。"
    - "Wi-Fi 在视频面试进行到一半的时候断了。"
    - "手机内存满了删了半天照片才腾出200M。"
    - "蓝牙耳机连上了同事的电脑，自己的播放列表在公共区域外放了五秒。"
    - "打了一大段话正要发送，APP闪退了，回来发现输入框是空的。"

- category: "生物骚扰"
  events:
    - "房间里有一只蚊子，关灯就来嗡嗡开灯就消失。"
    - "在路上被鸟屎砸中了肩膀，还是白色衣服。"
    - "楼道里的流浪猫在门口拉了一泡，踩到了才发现。"
    - "阳台上的绿萝养了三个月终于长出新叶子，第二天被风吹断了。"

- category: "时间坑"
  events:
    - "约好了十点见面，到了才收到消息说改到下午两点。"
    - "提前半小时到了咖啡馆等人，结果对方放了鸽子。"
    - "排了一小时的号，轮到自己的时候被告知系统故障今天办不了。"
    - "设了五个闹钟全按掉了，醒来的时候已经迟到四十分钟。"
    - "准时赶到银行，发现今天人家提前下班了。"
