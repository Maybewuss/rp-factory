# 外部 Prompt 变体扩展
# 在此添加的变体会与内置变体合并，增加随机多样性
# 格式：每个 key 对应一个 prompt 位置，value 为字符串列表
#
# 可用的 key:
#   step1_reverse_intent    — 冰山 Step1 动机反推
#   step2_event_anchoring   — 冰山 Step2 实体锚定
#   step3_obfuscated_generation — 冰山 Step3 加密生成
#   mentor_hint             — Pipeline A Mentor 考点拆解
#   memory_poison           — 记忆投毒生成
#   cognitive_translation   — 认知转译问题生成
#   continuation            — 多轮对话续写
#
# 模板中可用的占位符（视具体位置）：
#   {proxy_event} {deep_intent} {user_style} {severity} {persona_summary} {history}

# 示例：取消注释并添加你的变体
# step1_reverse_intent:
#   - "你是一位文学批评家，请从角色原型的角度分析..."
# step3_obfuscated_generation:
#   - "你是一个刚下班的打工人，{proxy_event}..."
