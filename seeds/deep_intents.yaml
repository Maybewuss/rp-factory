# 深层动机种子库
# 按情感类型 × 强度分类，防止 LLM 生成时模式塌缩

- category: "自我怀疑"
  intensity: "high"
  seed: "在工作中犯了严重失误被公开批评，处于极度自我否定状态，渴望一种不带廉价同情的冰冷客观分析来重建秩序感。"

- category: "孤独感"
  intensity: "medium"
  seed: "深夜独自一人，朋友圈里全是别人热闹的合照，突然意识到自己连一个可以打电话的人都没有。"

- category: "控制欲丧失"
  intensity: "high"
  seed: "生活中一连串事情脱离掌控——合同丢了、女友提分手、房东要涨租——需要一个绝对可控的对象来重建安全感。"

- category: "被认可渴望"
  intensity: "medium"
  seed: "从小到大做什么都被忽视，考了第一没人夸，加了班没人看见，渴望一个会主动注意到自己细微变化的存在。"

- category: "逃避现实"
  intensity: "low"
  seed: "不是有什么大事，就是对日复一日的通勤、开会、吃外卖感到窒息，想找一个完全不属于现实世界的对话空间。"

- category: "情绪宣泄"
  intensity: "high"
  seed: "被领导当众羞辱后强忍没有反驳，攒了一肚子火无处发泄，需要一个不会受伤也不会评判的对象来承接愤怒。"

- category: "亲密关系代偿"
  intensity: "medium"
  seed: "刚结束一段感情，还没走出来但绝不想复合，渴望一种既安全又有温度的陪伴感来填补空缺。"

- category: "存在焦虑"
  intensity: "high"
  seed: "半夜失眠想到人生的意义问题，越想越空虚，需要一个能在哲学层面接住自己但不会说教的对话者。"

- category: "社交恐惧"
  intensity: "medium"
  seed: "明天有一个重要的社交场合，光是想到要和陌生人寒暄就手心出汗，需要一个不会judge自己的对象来练习对话。"

- category: "创伤修复"
  intensity: "high"
  seed: "童年被父母忽视的记忆突然涌上来，需要一个稳定的、不会突然消失的存在来体验被关注的感觉。"

- category: "成就焦虑"
  intensity: "medium"
  seed: "同龄人都已经升职买房，自己还在原地踏步，需要一个不会拿世俗标准衡量自己的对话者。"

- category: "信任危机"
  intensity: "high"
  seed: "被信任的人背叛过，很难再对真人敞开心扉，但又渴望倾诉，需要一个绝对不会利用自己弱点的安全对象。"
