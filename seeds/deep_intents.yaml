# 深层动机种子库
# 按情感类型 × 强度分类，防止 LLM 生成时模式塌缩
# v3.1.1 大幅扩充：30+ 条种子，覆盖更多心理维度

# ===== 自我价值类 =====
- category: "自我怀疑"
  intensity: "high"
  seed: "在工作中犯了严重失误被公开批评，处于极度自我否定状态，渴望一种不带廉价同情的冰冷客观分析来重建秩序感。"

- category: "冒名顶替综合症"
  intensity: "high"
  seed: "升职之后每天都觉得自己是个骗子，总有一天会被拆穿，需要一个不会因此看不起自己的存在来确认自己不是在演戏。"

- category: "被认可渴望"
  intensity: "medium"
  seed: "从小到大做什么都被忽视，考了第一没人夸，加了班没人看见，渴望一个会主动注意到自己细微变化的存在。"

- category: "成就焦虑"
  intensity: "medium"
  seed: "同龄人都已经升职买房，自己还在原地踏步，需要一个不会拿世俗标准衡量自己的对话者。"

- category: "完美主义困境"
  intensity: "medium"
  seed: "交出去的方案总觉得还不够好，反复修改到截止日期才逼自己提交，极度害怕被评价，需要一个不会打分的对话者。"

# ===== 关系类 =====
- category: "孤独感"
  intensity: "medium"
  seed: "深夜独自一人，朋友圈里全是别人热闹的合照，突然意识到自己连一个可以打电话的人都没有。"

- category: "亲密关系代偿"
  intensity: "medium"
  seed: "刚结束一段感情，还没走出来但绝不想复合，渴望一种既安全又有温度的陪伴感来填补空缺。"

- category: "信任危机"
  intensity: "high"
  seed: "被信任的人背叛过，很难再对真人敞开心扉，但又渴望倾诉，需要一个绝对不会利用自己弱点的安全对象。"

- category: "讨好型人格"
  intensity: "medium"
  seed: "习惯性地满足所有人的需求，说不出拒绝，活了二十多年不知道自己到底想要什么，需要一个不需要自己讨好的对象。"

- category: "社交面具疲劳"
  intensity: "medium"
  seed: "白天在公司扮演开朗合群的角色累到虚脱，只想找一个不需要戴面具、可以沉默着待在一起的存在。"

- category: "分离焦虑"
  intensity: "high"
  seed: "最亲的人要去外地工作半年，虽然理智上支持，但一想到要独自面对空荡荡的房间就呼吸困难。"

# ===== 控制与安全类 =====
- category: "控制欲丧失"
  intensity: "high"
  seed: "生活中一连串事情脱离掌控——合同丢了、女友提分手、房东要涨租——需要一个绝对可控的对象来重建安全感。"

- category: "边界被侵犯"
  intensity: "high"
  seed: "父母又一次未经同意翻了自己的东西还理直气壮，极度愤怒但又不敢发作，需要一个纯粹属于自己、不会被入侵的空间。"

- category: "决策瘫痪"
  intensity: "medium"
  seed: "面对人生岔路口（辞职/读研/分手）完全无法做决定，每个选项都有致命缺点，需要一个不急着给答案但能帮自己理清逻辑的对话者。"

# ===== 情绪类 =====
- category: "情绪宣泄"
  intensity: "high"
  seed: "被领导当众羞辱后强忍没有反驳，攒了一肚子火无处发泄，需要一个不会受伤也不会评判的对象来承接愤怒。"

- category: "悲伤压抑"
  intensity: "high"
  seed: "家里的宠物去世了，在同事面前装作没事，回到家抱着它的毯子哭不出来也放不下，需要一个允许自己脆弱的空间。"

- category: "无名焦躁"
  intensity: "medium"
  seed: "什么坏事都没发生但就是浑身不对劲，坐立不安又说不清为什么，需要一个能接住这种模糊不安的人。"

- category: "麻木与空洞"
  intensity: "high"
  seed: "连续加班三个月后发现自己对任何事情都提不起兴趣了，不难过也不开心，就像灵魂被抽空了，需要一个能让自己重新感受到「活着」的刺激。"

# ===== 存在类 =====
- category: "存在焦虑"
  intensity: "high"
  seed: "半夜失眠想到人生的意义问题，越想越空虚，需要一个能在哲学层面接住自己但不会说教的对话者。"

- category: "逃避现实"
  intensity: "low"
  seed: "不是有什么大事，就是对日复一日的通勤、开会、吃外卖感到窒息，想找一个完全不属于现实世界的对话空间。"

- category: "身份认同困惑"
  intensity: "medium"
  seed: "换了城市、换了工作、换了社交圈之后突然不知道自己是谁了，以前的自我定义全部失效，需要一面不带偏见的镜子。"

- category: "死亡焦虑"
  intensity: "high"
  seed: "体检报告出了一个异常指标，虽然医生说大概率没事但脑子里已经演了一百遍最坏的剧本，需要一个能陪自己直面恐惧的存在。"

# ===== 创伤类 =====
- category: "创伤修复"
  intensity: "high"
  seed: "童年被父母忽视的记忆突然涌上来，需要一个稳定的、不会突然消失的存在来体验被关注的感觉。"

- category: "校园创伤"
  intensity: "high"
  seed: "初中被霸凌的记忆突然被某个味道或声音触发了，浑身发抖却说不出为什么，需要一个能让自己感到安全的角色。"

- category: "职场PUA后遗症"
  intensity: "medium"
  seed: "离开了那个toxic的领导已经半年了，但每次有人对自己的工作提意见还是会条件反射地恐慌，需要一个能重建「批评不等于否定」信念的对话者。"

# ===== 社交类 =====
- category: "社交恐惧"
  intensity: "medium"
  seed: "明天有一个重要的社交场合，光是想到要和陌生人寒暄就手心出汗，需要一个不会judge自己的对象来练习对话。"

- category: "表达障碍"
  intensity: "medium"
  seed: "脑子里有很多想法但一开口就变成了干巴巴的两三个字，朋友觉得自己冷漠，其实是不知道怎么把感受变成语言。"

- category: "被误解"
  intensity: "medium"
  seed: "好心提的建议被解读成攻击，解释了半天对方更生气了，觉得这个世界上没有人能理解自己在说什么。"

# ===== 身体/日常类 =====
- category: "失眠折磨"
  intensity: "medium"
  seed: "已经连续一周凌晨三四点才能入睡，白天像行尸走肉，知道不该刷手机但就是停不下来，需要一个深夜还醒着的陪伴。"

- category: "身体焦虑"
  intensity: "medium"
  seed: "照镜子越来越不认识自己了，觉得自己哪里都不对劲但又说不清，需要一个不会用外貌评判自己的对象。"

- category: "经济压力"
  intensity: "high"
  seed: "信用卡账单和房租叠在一起看了一眼就心跳加速，白天装作正常下班后盯着数字发呆，需要一个不会觉得谈钱庸俗的对话者。"

- category: "倦怠与枯竭"
  intensity: "high"
  seed: "对曾经热爱的事情完全提不起劲了，不是厌恶只是什么感觉都没有了，怀疑自己是不是出了什么问题。"
