# RP 数据合成工厂配置 v3.2

llm:
  generator:
    model: "gpt-4o"
    base_url: null
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.9
    max_tokens: 2048

  teacher:
    model: "claude-3-5-sonnet-20241022"
    base_url: null
    api_key_env: "ANTHROPIC_API_KEY"
    temperature: 0.7
    max_tokens: 4096

  mentor:
    model: "gpt-4o"
    base_url: null
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.3
    max_tokens: 2048

  target:
    model: "qwen-max"
    base_url: null
    api_key_env: "TARGET_MODEL_API_KEY"
    temperature: 0.7
    max_tokens: 2048

user_agent:
  iceberg:
    diversity:
      enable_style_injection: true
      user_styles:
        - "话少冷淡型"
        - "碎碎念型"
        - "暴躁直接型"
        - "故作轻松型"
        - "理性压抑型"
        - "撒娇依赖型"
        - "反讽毒舌型"
      ngram_collapse_threshold: 0.7

context_control:
  flavored_task:
    injection_probability: 0.3
    injection_rounds: [3, 4, 5]

  memory_poisoning:
    injection_probability: 0.25
    severity_distribution:
      critical: 0.3
      trivial: 0.4
      correct: 0.3

  cognitive_translation:
    strict_sandbox_tag: "<strict_historical_sandbox>"

rp_agent:
  pipeline_a:
    enabled: true
  pipeline_b:
    enabled: true
    n_samples: 8
    temperature: 0.9
    max_concurrent: 4
  mix_ratio:
    pipeline_a: 0.5
    pipeline_b: 0.5

quality:
  level1:
    persona_blacklist_patterns:
      - "作为AI"
      - "作为一个AI"
      - "我是一个AI"
      - "好的，为您"
      - "如果您还需要"
      - "很高兴为您"
      - "请问还有什么"
      - "作为语言模型"
      - "I'm an AI"
      - "As an AI"
    payload_lint_enabled: true
  level2:
    enabled: true

evaluation:
  sample_ratio: 0.1

output:
  format: "jsonl"
  output_dir: "output"
  include_meta: true
  compress: false

pipeline:
  conversation_turns: 6
  max_concurrent_conversations: 5
